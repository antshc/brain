[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-tools"
version = "0.1.0"
description = "AFK automated PR review service driven by Copilot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ralph = "afk.fix_prs:main"

[tool.setuptools.packages.find]
where = ["tools/src"]
include = ["afk*", "modules*"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
