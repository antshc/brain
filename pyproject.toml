[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-tools"
version = "0.1.0"
description = "AFK automated PR review service driven by Copilot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ralph = "brain_tools.ralph:main"
fetch-threads-script = "brain_tools.fetch_threads:main"

[tool.setuptools.packages.find]
include = ["brain_tools*"]
