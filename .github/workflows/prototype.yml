name: Prototype

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  prototype:
    name: Prototype
    if: startsWith(github.head_ref, 'proto/')
    runs-on: ubuntu-latest
    env:
      PROTOTYPE_NAME: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Resolve prototype path
        id: prototype
        shell: bash
        run: |
          set -euo pipefail
          prototype_name="${PROTOTYPE_NAME#proto/}"

          if [[ ! "$prototype_name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Branch must be named proto/<prototype-name>, where <prototype-name> is a single directory name." >&2
            exit 1
          fi

          prototype_dir="prototype/$prototype_name"
          prototype_main="$prototype_dir/main.py"

          if [[ ! -f "$prototype_main" ]]; then
            echo "Missing prototype entry point: $prototype_main" >&2
            exit 1
          fi

          echo "dir=$prototype_dir" >> "$GITHUB_OUTPUT"
          echo "main=$prototype_main" >> "$GITHUB_OUTPUT"

      - name: Install prototype dependencies
        shell: bash
        run: |
          set -euo pipefail
          requirements_file="${{ steps.prototype.outputs.dir }}/requirements.txt"

          if [[ -f "$requirements_file" ]]; then
            python -m pip install --upgrade pip
            python -m pip install -r "$requirements_file"
          fi

      - name: Run prototype
        run: python3 "${{ steps.prototype.outputs.main }}"
